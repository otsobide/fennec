[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[test]]
name = "kernel"
path = "../../tests/libs/kernel/tests.rs"

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["full"] }
shared-domain-events = { path = "../shared/domain-events" }

[dependencies]
shared-cqrs = { path = "../shared/cqrs" }
shared-valueobject = { path = "../shared/valueobject" }
shared-domain-events = { path = "../shared/domain-events" }
shared-persistence-postgres = { path = "../shared/persistence-postgres" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "ipnet", "migrate", "macros", "sqlx-toml"] }
async-trait = "0.1"
idna = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
